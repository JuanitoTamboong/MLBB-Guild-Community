<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB · Loading</title>
    <link rel="stylesheet" href="./css/loading-screen.css">
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="./css/style.css" />

</head>
<body>
    <audio id="bgMusic" src="./sound/samuelfjohanns-the-cradle-113847.mp3" preload="auto" loop></audio>

    <div id="loadingView" class="loading-container">
    
        <!-- Background -->
        <div class="loading-bg">
            <img src="./assets/loading-assets/Loading-bg.png" alt="Loading Background" class="bg-image">
        </div>

        <!-- Loading Screen Content -->
        <div class="loading-content">
            <div class="loading-screen-wrapper">
                <!-- Loading-Screen.png as background -->
                <img src="./assets/loading-assets/Loading-Screen.png" alt="Loading" class="loading-image" id="loadingImage" />
                
                <!-- OVERLAY - everything on top of the PNG -->
                <div class="loading-overlay">
                    <!-- Percentage -->
                    <span class="progress-percent" id="progressText">0%</span>
                    
                    <!-- Progress Bar - WIDE to match PNG -->
                    <div class="progress-bar-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                    
                    <!-- Loading Tips -->
                    <div class="loading-tips">
                        <p id="tipText">⚔ Summon your ancient power...</p>
                    </div>

                    <!-- Guild Badge -->
                    <div class="guild-badge-loading">
                        <span class="badge-icon">⚔</span>
                        <span class="badge-text">ANCIENT ORDER</span>
                        <span class="badge-icon">🛡</span>
                    </div>

                    <!-- Enter button -->
                    <button id="enterBtn" class="enter-btn" type="button">
                        <img class="enter-btn-img" src="./assets/loading-assets/completed-btn.png" alt="Enter" />
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Login view (hidden until loading completes) -->
    <div id="loginView" class="container" style="display:none;">
        <div class="form-wrapper">
            <!-- form background -->
            <img src="./assets/mlbb-form.png" alt="Guild Hall" class="form-bg-img" />
            <!-- overlay content -->
            <div class="auth-overlay">
                <!-- ancient seal -->
                <div class="guild-seal">
                    <span class="seal-rune">ᚠ</span>
                    <span class="seal-text">ANCIENT ORDER</span>
                    <span class="seal-rune">ᚢ</span>
                </div>

                <!-- title -->
                <h1 class="auth-title">MLBB GUILD LOGIN</h1>

                <!-- form -->
                <form class="auth-form" action="#" method="post">
                    <div class="field">
                        <label for="account">⚔ ACCOUNT / EMAIL</label>
                        <input
                            id="account"
                            name="account"
                            type="text"
                            autocomplete="username"
                            placeholder="Enter your guild name"
                            required
                        />
                    </div>

                    <div class="field">
                        <label for="password">🔑 PASSWORD</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="••••••••"
                            required
                        />
                    </div>

                    <div class="row">
                        <a class="link" href="#">Forgot your rune?</a>
                    </div>

                    <button class="btn-login" type="submit">
                        <img src="./assets/login-btn.svg" alt="Enter the Guild" class="btn-login-img" />
                    </button>

                    <div class="divider"></div>

                    <p class="muted">
                        No guild yet?
                        <a class="link" href="#">Summon your clan</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Audio-safe: show login + start sound from loading.js -->
    <script src="./js/loading.js"></script>

    <!-- Particles + login effects (run after login becomes visible) -->
    <script src="./animated/particles-fireflies.js" defer></script>
    <script src="./js/script.js" defer></script>

</body>
</html>
