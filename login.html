<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLBB · Login</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/fonts.css" />
</head>
<body>
  <div class="container">
    <div id="loginView" class="container" style="display:flex;">
      <div class="form-wrapper">
        <img src="./assets/mlbb-form.png" alt="Guild Hall" class="form-bg-img" />
        <div class="auth-overlay">
          <img class="form-logo" src="./assets/mlbb-g-c-logo.png" alt="MLBB G.C" />

          <div class="guild-seal">
            <span class="seal-rune">ᚠ</span>
            <span class="seal-text">ANCIENT ORDER</span>
            <span class="seal-rune">ᚢ</span>
          </div>

          <h1 class="auth-title">MLBB GUILD LOGIN</h1>

          <form id="loginForm" class="auth-form" action="#" method="post">
            <div class="field">
              <label for="account">⚔ ACCOUNT / EMAIL</label>
              <input
                id="account"
                name="account"
                type="text"
                autocomplete="username"
                placeholder="Enter your guild name"
                required
              />
            </div>

            <div class="field">
              <label for="password">🔑 PASSWORD</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
            </div>

            <div class="row">
              <a class="link" href="#">Forgot your rune?</a>
            </div>

            <button class="btn-login" type="submit">
              <img src="./assets/login-btn.svg" alt="Enter the Guild" class="btn-login-img" />
            </button>

            <div
              id="loginError"
              style="display:none; color: rgba(232, 213, 163, 0.85); font-size: 10px; text-align:center; padding-top: 6px;"
            ></div>

            <div class="divider"></div>

            <p class="muted">
              No guild yet?
              <a class="link" href="#" data-action="go-signup">Create Account</a>
            </p>
          </form>
        </div>
      </div>
    </div>

    <div id="signupView" class="container" style="display:none;">
      <div class="form-wrapper">
        <img src="./assets/mlbb-form.png" alt="Guild Hall" class="form-bg-img" />
        <div class="auth-overlay">
          <img class="form-logo" src="./assets/mlbb-g-c-logo.png" alt="MLBB G.C" />

          <div class="guild-seal">
            <span class="seal-rune">ᚠ</span>
            <span class="seal-text">ANCIENT ORDER</span>
            <span class="seal-rune">ᚢ</span>
          </div>

          <h1 class="auth-title">MLBB GUILD SIGN UP</h1>

          <form id="signupForm" class="auth-form" action="#" method="post">
            <div class="field">
              <label for="signupAccount">⚔ ACCOUNT / EMAIL</label>
              <input
                id="signupAccount"
                name="signupAccount"
                type="text"
                autocomplete="username"
                placeholder="Enter your guild name"
                required
              />
            </div>

            <div class="field">
              <label for="signupIgn">🕹️ IGN</label>
              <input
                id="signupIgn"
                name="signupIgn"
                type="text"
                autocomplete="nickname"
                placeholder="Enter your IGN"
                required
              />
            </div>

            <div class="field">
              <label for="signupMlId">🪪 ML ID</label>
              <input
                id="signupMlId"
                name="signupMlId"
                type="text"
                inputmode="numeric"
                placeholder="Enter your ML ID"
                required
              />
            </div>

            <div class="field">
              <label for="signupPassword">🔑 PASSWORD</label>
              <input
                id="signupPassword"
                name="signupPassword"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••"
                required
              />
            </div>


            <div
              id="signupError"
              style="display:none; color: rgba(232, 213, 163, 0.85); font-size: 10px; text-align:center; padding-top: 6px;"
            ></div>

            <button class="btn-login" type="submit">
              <img src="./assets/login-btn.svg" alt="Create account" class="btn-login-img" />
            </button>

            <div class="divider"></div>

            <p class="muted">
              Already have a guild?
              <a class="link" href="#" data-action="go-login">Return to login</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="./animated/particles-fireflies.js"></script>
  <script type="module" src="./js/script.js"></script>
</body>
</html>
