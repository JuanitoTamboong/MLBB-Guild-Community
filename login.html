<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLBB Guild · Ancient Order</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <!-- form background -->
            <img src="./assets/mlbb-form.png" alt="Guild Hall" class="form-bg-img" />

            <!-- overlay content -->
            <div class="auth-overlay">
                <!-- ancient seal -->
                <div class="guild-seal">
                    <span class="seal-rune">ᚠ</span>
                    <span class="seal-text">ANCIENT ORDER</span>
                    <span class="seal-rune">ᚢ</span>
                </div>

                <!-- title -->
                <h1 class="auth-title">MLBB GUILD LOGIN</h1>

                <!-- form -->
                <form class="auth-form" action="#" method="post">
                    <div class="field">
                        <label for="account">⚔ ACCOUNT / EMAIL</label>
                        <input
                            id="account"
                            name="account"
                            type="text"
                            autocomplete="username"
                            placeholder="Enter your guild name"
                            required
                        />
                    </div>

                    <div class="field">
                        <label for="password">🔑 PASSWORD</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="••••••••"
                            required
                        />
                    </div>

                    <div class="row">
                        <a class="link" href="#">Forgot your rune?</a>
                    </div>

                    <button class="btn-login" type="submit">
                        <img src="./assets/login-btn.svg" alt="Enter the Guild" class="btn-login-img" />
                    </button>

                    <div class="divider"></div>

                    <p class="muted">
                        No guild yet?
                        <a class="link" href="#">Summon your clan</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="./animated/particles-fireflies.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
